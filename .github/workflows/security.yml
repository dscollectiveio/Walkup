# Automated vulnerability and end-of-life scanning — docs/SECURITY_POLICY.md
# "Vulnerability and patch management". A failed run emails the repo owner;
# the patch SLA clock starts from the first failing run.
name: Security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 14 * * 1" # Mondays, 14:00 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dependencies:
    name: Dependency vulnerabilities
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=high

  end-of-life:
    name: Runtime end-of-life
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: node scripts/check-eol.mjs
